[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rulesmith"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "PyYAML>=6,<7", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[project.scripts]
rulesmith = "rulesmith.cli:main"

[tool.setuptools.packages.find]
include = ["rulesmith*"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
